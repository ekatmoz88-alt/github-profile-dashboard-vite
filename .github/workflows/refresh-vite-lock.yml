name: Refresh Vite lockfile

on:
  push:
    branches:
      - chore/vite-6.4.4
    paths:
      - package.json
      - .github/workflows/refresh-vite-lock.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chore/vite-6.4.4
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --lockfile-version=3
      - name: Verify clean installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify production build
        run: npm run build
      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Regenerate lockfile for Vite 6.4.4"
          git push
