name: Build and deploy Vite dashboard
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docs/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - ".spectral.yaml"
      - "vite.config.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate architecture case studies page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          page = Path("public/architecture-case-studies.html")
          if not page.is_file():
              sys.exit("ERROR: public/architecture-case-studies.html is missing")

          content = page.read_text(encoding="utf-8")
          repositories = [
              "rudp-architecture-showcase",
              "infotainment-services-architecture-showcase",
              "embedded-tls-architecture-showcase",
              "routing-engine-architecture-showcase",
          ]

          for repository in repositories:
              repo_url = f"https://github.com/ekatmoz88-alt/{repository}"
              badge_url = f"{repo_url}/actions/workflows/ci.yml/badge.svg?branch=main"
              if repo_url not in content:
                  sys.exit(f"ERROR: repository link is missing: {repository}")
              if badge_url not in content:
                  sys.exit(f"ERROR: GitHub Actions badge is missing: {repository}")

          if content.count("badge.svg?branch=main") != 4:
              sys.exit("ERROR: expected exactly four GitHub Actions CI badges")

          print("Architecture case studies page: all four repository links and CI badges validated.")
          PY
      - run: npm run build
      - name: Validate OpenAPI draft with Spectral
        run: npx --yes @stoplight/spectral-cli@6.15.0 lint docs/global11-olap/openapi-draft.yaml --fail-severity=error
      - name: Include standalone review pages
        run: |
          mkdir -p dist/docs
          cp docs/*.html dist/docs/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
